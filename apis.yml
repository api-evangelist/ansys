apis:
  - aid: ansys:pyansys
    name: PyAnsys
    description: >-
      Open-source Python ecosystem for Ansys products. The pyansys metapackage bundles 45+
      libraries including PyMAPDL (Mechanical APDL), PyFluent (Fluent CFD), PyAEDT
      (Electronics Desktop / HFSS / Maxwell / Icepak), PyMechanical (Mechanical),
      PyDPF (Data Processing Framework, with PyDPF-Core and PyDPF-Post), PyPrimeMesh
      (meshing), PyOptislang (optiSLang), PyAdditive, PyDyna (LS-DYNA), PyEDB, PyGranta,
      PySystemCoupling, and visualization helpers. Each library wraps a licensed Ansys
      product over gRPC or COM as a Pythonic interface — not a public REST API.
    humanURL: https://docs.pyansys.com
    baseURL: https://github.com/ansys/pyansys
    tags:
      - Python
      - SDK
      - Open Source
      - gRPC
      - Scripting
    tags_raw:
      - Python
      - SDK
      - Open Source
      - gRPC
      - Scripting
      - Open-Source
    properties:
      - type: Documentation
        url: https://docs.pyansys.com
      - type: Repository
        url: https://github.com/ansys/pyansys
      - type: GitHubOrg
        url: https://github.com/ansys
      - type: Package
        url: https://pypi.org/project/pyansys/
  - aid: ansys:cloud
    name: Ansys Cloud
    description: >-
      Ansys Cloud delivers on-demand HPC and Ansys product instances on Microsoft Azure for
      burst simulation workloads. Cloud access is gated through commercial entitlement and
      the Ansys Cloud portal; no public REST API or self-serve developer documentation is
      published.
    humanURL: https://www.ansys.com/it-solutions/ansys-cloud
    baseURL: https://www.ansys.com/it-solutions/ansys-cloud
    tags:
      - Cloud
      - HPC
      - Microsoft Azure
      - Bursting
    tags_raw:
      - Cloud
      - HPC
      - Azure
      - Bursting
    properties:
      - type: Documentation
        url: https://www.ansys.com/it-solutions/ansys-cloud
  - aid: ansys:mapdl-grpc
    name: Ansys MAPDL gRPC API
    description: >-
      gRPC service contract (package ansys.api.mapdl.v0) that PyMAPDL uses to drive a licensed
      Mechanical APDL server: command execution, input streaming, database access. Published as
      .proto files in the ansys/ansys-api-mapdl GitHub repository.
    humanURL: https://github.com/ansys/ansys-api-mapdl
    baseURL: grpc://localhost:50052
    tags: [gRPC, Simulation, FEA]
    properties:
      - type: Protobuf
        url: grpc/ansys-mapdl-mapdl.proto
      - type: Protobuf
        url: grpc/ansys-mapdl-mapdl_db.proto
      - type: Protobuf
        url: grpc/ansys-mapdl-ansys_kernel.proto
      - type: Protobuf
        url: grpc/ansys-mapdl-C_StreamGrpc.proto
      - type: SourceCode
        url: https://github.com/ansys/ansys-api-mapdl
  - aid: ansys:mechanical-grpc
    name: Ansys Mechanical gRPC API
    description: >-
      gRPC service contract (package ansys.api.mechanical.v0) used by PyMechanical to run scripts
      against a licensed Ansys Mechanical server, published in the ansys/ansys-api-mechanical repository.
    humanURL: https://github.com/ansys/ansys-api-mechanical
    baseURL: grpc://localhost:10000
    tags: [gRPC, Simulation, FEA]
    properties:
      - type: Protobuf
        url: grpc/ansys-mechanical.proto
      - type: SourceCode
        url: https://github.com/ansys/ansys-api-mechanical

